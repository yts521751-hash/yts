# Fly.io：長駐機器，適合排程與本機快取
# 首次：fly launch --no-deploy && fly deploy
# 之後：git push 觸發 GitHub Actions，或本機 fly deploy

app = "jinliu-board"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Asia/Taipei"
  NEXT_TELEMETRY_DISABLED = "1"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 43127
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
