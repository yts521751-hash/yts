# Render Blueprint：連上 GitHub 後一鍵建立服務，之後 push main 自動重發
# https://dashboard.render.com/blueprints
services:
  - type: web
    name: jinliu-board
    runtime: node
    # 第一次可用 free；若要避免休眠影響排程，之後在 Dashboard 升成 Starter
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Taipei
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
